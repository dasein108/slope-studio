schema: paperclip/v1

company:
  brandColor: "#2563eb"
  requireBoardApprovalForNewAgents: true

sidebar:
  agents:
    - ceo-operator
    - growth-lead
    - screenwriter
    - producer
    - qa-critic
    - analytics-learning
    - observability-ops
    - secretary
  projects:
    - slope-studio-company

agents:
  ceo-operator:
    adapter:
      type: codex_local
      config:
        model: gpt-5.4-mini
    runtime:
      defaultModel: gpt-5.4-mini
    permissions:
      approvalRequiredForSpend: true
      approvalRequiredForPublish: false
  growth-lead:
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
        search: true
    runtime:
      defaultModel: gpt-5.5
  screenwriter:
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
        search: true
    runtime:
      defaultModel: gpt-5.5
  producer:
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
        search: true
    runtime:
      defaultModel: gpt-5.5
    permissions:
      approvalRequiredForPaidStages: true
  qa-critic:
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
    runtime:
      defaultModel: gpt-5.5
    permissions:
      canBlockPaidStages: true
      canBlockPublish: true
  analytics-learning:
    adapter:
      type: codex_local
      config:
        model: gpt-5.5
    runtime:
      defaultModel: gpt-5.5
  observability-ops:
    adapter:
      type: codex_local
      config:
        model: gpt-5.4-mini
        search: true
    runtime:
      defaultModel: gpt-5.4-mini
  secretary:
    adapter:
      type: codex_local
      config:
        model: gpt-5.4-mini
    runtime:
      defaultModel: gpt-5.4-mini
    delivery:
      channel: telegram

projects:
  slope-studio-company:
    status: active
    color: "#2563eb"
    workspaces:
      slope-studio-local:
        name: Slope Studio local
        sourceType: local_path
        cwd: /Users/dasein/dev/slope-studio
        isPrimary: true
        visibility: default
    executionWorkspacePolicy:
      enabled: true
      defaultMode: shared_workspace
      allowIssueOverride: true

routines:
  daily-org-autopilot:
    triggers:
      - kind: schedule
        label: Daily growth autopilot
        cronExpression: "0 9 * * *"
        timezone: Asia/Makassar
  daily-secretary-report:
    triggers:
      - kind: schedule
        label: Daily Telegram report
        cronExpression: "0 18 * * *"
        timezone: Asia/Makassar
  weekly-observability-review:
    triggers:
      - kind: schedule
        label: Weekly observability and cost review
        cronExpression: "0 10 * * 1"
        timezone: Asia/Makassar

inputs:
  env:
    TELEGRAM_BOT_TOKEN:
      kind: secret
      requirement: required
      default: ""
    TELEGRAM_CHANNEL_ID:
      kind: plain
      requirement: required
      default: ""
    TELEGRAM_CHAT_ID:
      kind: plain
      requirement: optional
      default: ""
    PAPERCLIP_COMPANY_ID:
      kind: plain
      requirement: optional
      default: ""
