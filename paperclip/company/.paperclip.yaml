schema: paperclip/v1

company:
  brandColor: "#2563eb"
  requireBoardApprovalForNewAgents: true

sidebar:
  agents:
    - ceo-operator
    - growth-lead
    - screenwriter
    - producer
    - qa-critic
    - analytics-learning
    - observability-ops
    - secretary
  projects:
    - slope-studio-company

# All agents run the Claude Code adapter (claude_local). Idle/periodic heartbeats are
# DISABLED (heartbeat.enabled=false) — agents wake only on assignment, @mention, or the
# kept cron routine. Models: Opus for creative/QA, Sonnet for working roles, Haiku for light.
# (Runtime mutated live via PATCH /api/agents/<id>; this file kept in sync for future imports.)
agents:
  ceo-operator:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
    permissions:
      approvalRequiredForSpend: true
      approvalRequiredForPublish: false
  growth-lead:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
  screenwriter:
    adapter:
      type: claude_local
      config:
        model: claude-opus-4-8
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
  producer:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
    permissions:
      approvalRequiredForPaidStages: true
  qa-critic:
    adapter:
      type: claude_local
      config:
        model: claude-opus-4-8
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
    permissions:
      canBlockPaidStages: true
      canBlockPublish: true
  analytics-learning:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
  observability-ops:
    adapter:
      type: claude_local
      config:
        model: claude-haiku-4-5-20251001
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
  secretary:
    adapter:
      type: claude_local
      config:
        model: claude-haiku-4-5-20251001
        dangerouslySkipPermissions: true
    runtime:
      heartbeat:
        enabled: false
    delivery:
      channel: telegram

projects:
  slope-studio-company:
    status: active
    color: "#2563eb"
    workspaces:
      slope-studio-local:
        name: Slope Studio local
        sourceType: local_path
        cwd: /Users/dasein/dev/slope-studio
        isPrimary: true
        visibility: default
    executionWorkspacePolicy:
      enabled: true
      defaultMode: shared_workspace
      allowIssueOverride: true

# Only the daily org autopilot timer is kept — it is the cycle initiator + the deferred-
# measurement clock. The secretary-report and observability-review routines were DISABLED
# 2026-06-15 (paused + trigger disabled in runtime) to cut timer-driven token burn; secretary
# is covered by per-video Telegram pings (studio/notify.py). Re-enable in runtime if wanted.
routines:
  daily-org-autopilot:
    triggers:
      - kind: schedule
        label: Daily growth autopilot
        cronExpression: "0 9 * * *"
        timezone: Asia/Makassar

inputs:
  env:
    TELEGRAM_BOT_TOKEN:
      kind: secret
      requirement: required
      default: ""
    TELEGRAM_CHANNEL_ID:
      kind: plain
      requirement: required
      default: ""
    TELEGRAM_CHAT_ID:
      kind: plain
      requirement: optional
      default: ""
    PAPERCLIP_COMPANY_ID:
      kind: plain
      requirement: optional
      default: ""
